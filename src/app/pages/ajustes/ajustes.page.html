<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <!-- Botón para volver automáticamente a la Home -->
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Header colapsable adaptado para iOS -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ajustes</ion-title>
    </ion-toolbar>
  </ion-header>

<!-- Lista de configuración de la app -->
  <ion-list>
    <ion-list-header>Apariencia</ion-list-header>
    <ion-item>
      <ion-label>Modo Oscuro</ion-label>
      <!-- Enlazamos la propiedad checked con el servicio y capturamos el evento ionChange -->
      <ion-toggle [checked]="settingsService.isDarkMode()" (ionChange)="onToggleChange($event)"></ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
