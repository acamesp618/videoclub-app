
<ion-card [class.alquilada]="pelicula.alquilada">

  <!-- Imagen de la película -->
  <img
    [src]="pelicula.imagen || 'https://via.placeholder.com/300x450?text=Cine'"
    [alt]="pelicula.titulo"
    class="portada-pelicula" />

  <ion-item>
    <ion-checkbox
      color="success"
      slot="start"
      [checked]="pelicula.alquilada">
    </ion-checkbox>

    <ion-label [class.tachado]="pelicula.alquilada">
      {{ pelicula.titulo }}
    </ion-label>

  </ion-item>
</ion-card>
